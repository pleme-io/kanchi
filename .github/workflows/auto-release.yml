name: auto-release

# Three-line consumer shim. Every push to main runs the pleme-io substrate
# single-crate auto-release pipeline, shipping kanchi to crates.io:
#
#   bump patch  →  regenerate Cargo.gen.lock  →  commit  →  tag  →  push  →  publish
#
# Uses cargo-auto-release.yml directly (the proven single-crate path, same as
# kaname/awase) rather than the polymorphic auto-release.yml, which currently
# references not-yet-shipped per-language workflows. All logic lives in
# pleme-io/actions/* (Rust + tatara-lisp). Operators only manage this file.
# See the org-level ★★ AUTO-RELEASE directive + substrate/docs/AUTO-RELEASE.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/cargo-auto-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
    secrets: inherit
