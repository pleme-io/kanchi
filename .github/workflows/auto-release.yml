name: auto-release

# Three-line consumer shim. Every push to main runs the pleme-io substrate
# auto-release pipeline, which auto-detects this repo as a Rust single-crate
# and ships it to crates.io:
#
#   bump patch  →  regenerate Cargo.gen.lock  →  commit  →  tag  →  push  →  publish
#
# All logic lives in pleme-io/actions/* (Rust + tatara-lisp) +
# pleme-io/substrate/.github/workflows/auto-release.yml. Operators only manage
# this file; everything else is the substrate's reusable primitive. See the
# org-level ★★ AUTO-RELEASE directive + substrate/docs/AUTO-RELEASE.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/auto-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
    secrets: inherit
